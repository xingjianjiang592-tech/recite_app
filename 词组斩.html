<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>词组斩 · 考研词组训练</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#141720; --sub:#6b7280; --line:#e8eaef;
  --brand:#3b6ef6; --brand-soft:#eaf0ff; --ok:#10b981; --ok-soft:#e8f8f2;
  --bad:#ef4444; --bad-soft:#fdecec; --warn:#f59e0b;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior-y:none;
}
#app{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:72px}
.hide{display:none!important}
.wrap{padding:0 18px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
button{font-family:inherit;font-size:16px;cursor:pointer;border:0;background:none;color:inherit}

/* ---------- 顶部 ---------- */
.top{padding:22px 18px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
.top .sp{flex:1}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.chip b{color:var(--ink);font-weight:600}
.chip.on{background:var(--brand-soft);border-color:#c9d8ff;color:var(--brand)}
.chip.on b{color:var(--brand)}

/* ---------- 今日 ---------- */
.hero{margin:6px 18px 14px;padding:20px;position:relative;overflow:hidden}
.hero .row{display:flex;align-items:center;gap:18px}
.ring{width:86px;height:86px;flex:0 0 86px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.hero .txt{flex:1;min-width:0}
.hero .txt .big{font-size:17px;font-weight:650;margin-bottom:2px}
.hero .txt .sm{font-size:13px;color:var(--sub)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--brand);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:600;
  transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn[disabled]{opacity:.45;pointer-events:none}
.acts{margin:0 18px;display:flex;flex-direction:column;gap:10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 18px 0}
.stat{padding:14px 12px;text-align:center}
.stat .n{font-size:21px;font-weight:700;line-height:1.2}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px}

/* ---------- 学习卡 ---------- */
.study-top{padding:14px 18px 0}
.pbar{height:6px;background:#e6e9ef;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5b8bff,#3b6ef6);border-radius:999px;transition:width .3s}
.study-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:8px}
.qcard{margin:16px 18px;padding:26px 22px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.phrase{font-size:34px;line-height:1.25;font-weight:700;letter-spacing:-.3px;word-break:break-word}
@media (max-width:380px){.phrase{font-size:28px}}
.tags{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--sub);background:#f1f3f7;border-radius:6px;padding:3px 8px}
.speak{margin-top:14px;font-size:13px;color:var(--brand);display:inline-flex;align-items:center;gap:5px;width:auto;align-self:center;padding:6px 12px;border-radius:999px;background:var(--brand-soft)}

.opts{margin:4px 18px 0;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:15px 16px;font-size:15.5px;text-align:left;line-height:1.45;transition:.12s;color:var(--ink)}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:#f1f3f7;color:var(--sub);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

.feed{margin:14px 18px 0;padding:16px 18px;display:none}
.feed.show{display:block;animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feed .res{font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.feed .res.ok{color:var(--ok)} .feed .res.bad{color:var(--bad)}
.feed .cn{font-size:16px;font-weight:600;margin-bottom:10px;line-height:1.5}
.feed .ex{font-size:14px;line-height:1.65;color:#374151;padding-left:11px;border-left:3px solid #dfe4ee}
.feed .ex mark{background:#fff3c4;color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
.feed .src{font-size:12px;color:var(--sub);margin-top:7px}

.study-foot{margin:16px 18px 0;display:flex;gap:10px}

/* ---------- 结算 ---------- */
.sum{margin:24px 18px;padding:26px 20px;text-align:center}
.sum .big{font-size:46px;font-weight:750;line-height:1.1;letter-spacing:-1px}
.sum .cap{font-size:13px;color:var(--sub);margin-top:6px}
.sum .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.sum .grid .n{font-size:17px;font-weight:700;white-space:nowrap}
.sum .grid .l{font-size:12px;color:var(--sub)}
.wlist{margin:16px 18px;padding:6px 0}
.wlist h3{font-size:13px;color:var(--sub);font-weight:600;margin:14px 18px 6px}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .p{font-weight:600;font-size:15px}
.wrow .c{font-size:13px;color:var(--sub);margin-left:auto;text-align:right;max-width:48%}

/* ---------- 词书 ---------- */
.search{margin:8px 18px 0;display:flex;gap:8px}
.search input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);outline:none}
.search input:focus{border-color:#c9d8ff;box-shadow:0 0 0 3px var(--brand-soft)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{white-space:nowrap}
.list{margin:6px 18px 0}
.li{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .p{font-weight:600;font-size:15px;line-height:1.4}
.li .c{font-size:12.5px;color:var(--sub);margin-top:1px}
.li .dot{width:8px;height:8px;border-radius:50%;background:#dfe3ea;margin-top:7px;flex:0 0 8px}
.li .dot.s1{background:#93b4ff} .li .dot.s2{background:#5b8bff} .li .dot.s3{background:#2d5cd6} .li .dot.s4{background:var(--ok)}
.li .dot.bad{background:var(--bad)}

/* ---------- 进度 ---------- */
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin:0 18px}
.heat i{aspect-ratio:1;border-radius:4px;background:#eceff4}
.heat i[data-l="1"]{background:#d5e1ff} .heat i[data-l="2"]{background:#a9c2ff}
.heat i[data-l="3"]{background:#6f95f7} .heat i[data-l="4"]{background:#3b6ef6}
.bars{margin:12px 18px 0}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar .n{flex:0 0 84px;color:var(--sub)}
.bar .t{flex:1;height:9px;background:#eceff4;border-radius:999px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:999px;background:#9db8f7}
.bar .v{flex:0 0 42px;text-align:right;color:var(--sub)}

/* ---------- 底部 tab ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;max-width:680px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:11px 0 12px;font-size:11px;color:#9aa1ae;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--brand)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 设置行 ---------- */
.row2{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.row2 .l{font-size:15px}
.row2 .r{margin-left:auto;color:var(--sub);font-size:14px}
.seg{display:flex;background:#f1f3f7;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:48px 24px;line-height:1.8}
.sel{margin:10px 18px 0;display:flex;flex-direction:column;gap:8px}
.sel button{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.sel button .l{font-size:15px;font-weight:600}
.sel button .r{margin-left:auto;font-size:12px;color:var(--sub)}
.sel button.on{border-color:#c9d8ff;background:var(--brand-soft)}
</style>
</head>

function scopePool(){
  if(S.scope === "wrong"){
    return Object.values(S.cards).filter(c=>c.bad>0 && c.s<4).map(c=>c.i);
  }
  if(S.scope === "learning"){
    return Object.values(S.cards).filter(c=>c.s>0 && c.s<4).map(c=>c.i);
  }
  return null; // 全部
}
function dayPlanSet(dayVal){  // dayVal: "1".."28"
  const g = PLAN[+dayVal-1];
  return new Set(g||[]);
}
function buildQueue(){
  const now = Date.now();
  const pool = scopePool();
  let newIdx = [], revIdx = [];
  const inPool = i => !pool || pool.includes(i);
  // 新词：按计划顺序（当前 scope 为 today 时用当天组，否则用 plan 顺延）
  const learned = new Set(Object.keys(S.cards));
  if(S.scope === "today"){
    // 从第一天开始往后找没学过的，凑够 newPerDay
    for(const group of PLAN){
      for(const i of group){
        if(newIdx.length >= S.newPerDay) break;
        if(!learned.has(W[i][0])) newIdx.push(i);
      }
      if(newIdx.length >= S.newPerDay) break;
    }
  }else{
    for(let i=0;i<W.length;i++){
      if(newIdx.length >= S.newPerDay) break;
      if(inPool(i) && !learned.has(W[i][0])) newIdx.push(i);
    }
  }
  for(const c of Object.values(S.cards)){
    if(c.s<4 && c.due <= now && inPool(c.i)) revIdx.push(c.i);
  }
  // 复习先、新词后交替
  const q = [];
  let a=0,b=0;
  while(a<revIdx.length || b<newIdx.length){
    if(a<revIdx.length) q.push({i:revIdx[a++], kind:"rev"});
    if(b<newIdx.length) q.push({i:newIdx[b++], kind:"new"});
  }
  return q;
}

function buildOptions(i){
  const t = W[i];
  const right = t[1];
  const picked = new Set([i]);
  const same = [];
  for(let k=0;k<W.length && same.length<12;k++){
    if(k===i) continue;
    if(W[k][2]===t[2]) same.push(k);
  }
  shuffle(same);
  const opts = [{i, txt:right, ok:true}];
  for(const k of same){
    if(picked.size>=4) break;
    if(picked.has(k)) continue;
    if(W[k][1]===right) continue;
    picked.add(k);
    opts.push({i:k, txt:W[k][1], ok:false});
  }
  // 兜底：类别不够就用其余条目补
  for(let k=0;k<W.length && opts.length<4;k++){
    if(picked.has(k)) continue;
    picked.add(k);
    opts.push({i:k, txt:W[k][1], ok:false});
  }
  shuffle(opts);
  return opts;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function ring(pct, size=86, stroke=7){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const off = c*(1-Math.max(0,Math.min(1,pct)));
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#e9ecf2" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="url(#g1)" stroke-width="${stroke}" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f95f7"/><stop offset="1" stop-color="#3b6ef6"/></linearGradient></defs>
  </svg>`;
}

function streak(){

                ["wrong","错题本","答错过的"]];
  TOP.innerHTML = `<h1>切档案</h1><div class="sp"></div><button class="chip" id="back">返回</button>`;
  V.innerHTML = `<div class="sel" style="margin-top:6px">${opts.map(([k,l,r],idx)=>{
      const cnt = k==="wrong"?Object.values(S.cards).filter(c=>c.bad>0 && c.s<4).length:
                  k==="learning"?Object.values(S.cards).filter(c=>c.s>0&&c.s<4).length:
                  k==="all"?W.length:PLAN.reduce((a,g)=>a+g.length,0);
      return `<button data-k="${k}" class="${S.scope===k?"on":""}"><span class="l">${l}</span><span class="r">${cnt} 条</span></button>`;
    }).join("")}</div>`;
  document.getElementById("back").onclick = route;
  V.querySelector(".sel").onclick = e=>{ const b=e.target.closest("button[data-k]"); if(b){ S.scope=b.dataset.k; save(); route(); } };
}

/* ---------- 学习 ---------- */
let Q = null, cur = 0, answered = false, roundStart = 0, roundRight = 0, roundTotal = 0, wrongList = [];
let roundKilled = 0, killList = [], lastKillAt = 0;
let REQ = new Set();   // 本轮已重排过的卡片，同一张卡最多再出现一次

function startStudy(mode){
  let q = buildQueue();
  if(mode === "review") q = q.filter(x=>x.kind==="rev");
  if(mode === "wrong"){
    S.scope = "wrong"; save();
    q = [];
    const now = Date.now();
    for(const c of Object.values(S.cards)) if(c.bad>0) q.push({i:c.i, kind:"rev"});
    shuffle(q);
  }
  if(!q.length){ toast("没有要学的内容，换个档案试试"); route(); return; }
  Q = q; cur = 0; roundStart = Date.now(); roundRight = 0; roundTotal = 0; wrongList = []; REQ = new Set();
  roundKilled = 0; killList = [];
  TAB = "home"; renderTabs(); setTabs(false);
  renderStudy();
  window.scrollTo(0,0);
}

function renderStudy(){
  if(cur >= Q.length){ return renderSummary(); }
  answered = false;
  const item = Q[cur];
  const t = W[item.i];
  const opts = buildOptions(item.i);
  const pct = (cur)/(Q.length);

  TOP.innerHTML = `<button class="chip" id="quit">‹ 退出</button><div class="sp"></div>
     <button class="chip" id="kill" title="认识它，直接斩掉，不再复习">⚡ 斩</button>
     <span class="chip">${item.kind==="new"?"新词":"复习"}</span>`;
  V.innerHTML = `
    <div class="study-top">
      <div class="pbar"><i style="width:${pct*100}%"></i></div>
      <div class="study-meta"><span>${cur+1} / ${Q.length}</span><span>本轮答对 ${roundRight}</span></div>
    </div>
    <div class="card qcard">
      <div class="phrase">${esc(t[0])}</div>
      <div class="tags">
        <span class="tag">${CATS[t[2]]}</span>
        ${t[3]?`<span class="tag">真题 ${t[3]} 次</span>`:`<span class="tag">真题未出现</span>`}
      </div>
      <button class="speak" id="speak">🔊 听发音</button>
    </div>
    <div class="opts" id="opts">
      ${opts.map((o,idx)=>`<button class="opt" data-ok="${o.ok?1:0}" data-idx="${idx}">
        <span class="k">${"ABCD"[idx]}</span><span>${esc(o.txt)}</span></button>`).join("")}
    </div>
    <div class="card feed" id="feed"></div>
    <div class="study-foot" id="foot"><button class="btn ghost" id="dunno">不认识，直接看答案</button></div>`;

  document.getElementById("quit").onclick = ()=>{ if(confirm("退出本轮？已答的会保留")) route(); };
  const sp = document.getElementById("speak");
  sp.onclick = ()=>{ speak(t[0]); };
  const judge = (ok, clicked)=>{
    if(answered) return;
    answered = true;
    roundTotal++;
    const c = cardOf(item.i);
    document.querySelectorAll(".opt").forEach(o=>{
      o.disabled = true;
      if(o.dataset.ok==="1") o.classList.add("ok");
      else if(o===clicked) o.classList.add("bad");
    });
    if(ok){
      roundRight++;
      c.ok++; c.s = Math.min(4, c.s+1);
      c.due = Date.now() + INTERVALS[Math.min(c.s,4)];
      c.ts = Date.now();
      const dt = S.days[todayStr()] || (S.days[todayStr()]={n:0,r:0,ok:0,bad:0});
      if(item.kind==="new") dt.n++; else dt.r++;
      dt.ok++;
    }else{
      c.bad++; c.s = Math.max(0, c.s-1);
      c.due = Date.now() + INTERVALS[0]; c.ts = Date.now();
      const dt = S.days[todayStr()] || (S.days[todayStr()]={n:0,r:0,ok:0,bad:0});
      if(item.kind==="new") dt.n++; else dt.r++;
      dt.bad++;
      wrongList.push(item.i);
      // 答错的卡稍后重排，同一张卡本轮最多重来一次
      if(!REQ.has(item.i)){ REQ.add(item.i); Q.push({i:item.i, kind:"rev"}); }
    }
    S.lastDay = todayStr(); save();
    showFeed(item.i, ok, t);
  };
  document.getElementById("opts").onclick = e=>{
    const b = e.target.closest(".opt"); if(!b || answered) return;
    judge(b.dataset.ok === "1", b);
  };
  const dn = document.getElementById("dunno");
  if(dn) dn.onclick = ()=>judge(false, null);
  document.getElementById("kill").onclick = (e)=>{ if(e && e.currentTarget && !e.currentTarget.isConnected) return; killCurrent(); };
}

/* 斩：认识它，跳过——直接标记已掌握，不再进复习队列；可撤销 */
function killCurrent(){
  if(!Q || cur >= Q.length) return;
  if(answered){ toast("这题已经答过了，下一题再斩"); return; }
  const nowTs = Date.now();
  if(nowTs - lastKillAt < 180) return;   // 防双击误斩下一张（180ms 短于正常连斩节奏）
  lastKillAt = nowTs;
  const item = Q[cur], c = cardOf(item.i);   // 注意：cardOf 会建卡，必须放在防抖之后
  if(c.s >= 4){ toast("这个词已经斩过了"); return; }
  const prev = {s:c.s, due:c.due, ts:c.ts};
  c.s = 4; c.due = null; c.ts = Date.now();
  const dt = S.days[todayStr()] || (S.days[todayStr()]={n:0,r:0,ok:0,bad:0});
  const isNew = item.kind === "new";
  if(isNew) dt.n++; else dt.r++;
  roundKilled++;
  if(!killList.includes(item.i)) killList.push(item.i);
  S.lastDay = todayStr(); save();
  const name = W[item.i][0];
  cur++; window.scrollTo(0,0);
  if(cur >= Q.length) renderSummary(); else renderStudy();
  toast(`已斩「${name}」，不再进复习队列`, {label:"撤销", fn:()=>{
    c.s = prev.s; c.due = prev.due; c.ts = prev.ts;
    if(isNew) dt.n--; else dt.r--;
    roundKilled = Math.max(0, roundKilled-1);
    killList = killList.filter(x=>x!==item.i);
    save();
    toast("已恢复");
  }});
}

/* 复活：把已斩的词放回「熟悉」档，重新进复习队列 */
function revive(i){
  const c = S.cards[W[i][0]];
  if(!c) return;
  const prev = {s:c.s, due:c.due, ts:c.ts};
  c.s = 2; c.due = Date.now() + INTERVALS[2]; c.ts = Date.now();
  save(); renderList();
  toast(`「${W[i][0]}」已复活，3 天后再出现`, {label:"撤销", fn:()=>{
    c.s = prev.s; c.due = prev.due; c.ts = prev.ts; save(); renderList(); toast("已再次斩掉");
  }});
}

function showFeed(i, ok, t){
  const f = document.getElementById("feed");
  const ex = t[4] ? highlight(t[4], t[0]) : "";
  const exk = (t[6]||"").replace("english-","");   // 数据里是 english-i / english-ii
  const src = t[4] ? `${t[5]} 年${EXAM[exk]||""} ${(t[7]||"").replace("reading-text-","Text ").replace("cloze","完形").replace("translation","翻译")}` : "";
  f.innerHTML = `
    <div class="res ${ok?"ok":"bad"}">${ok?"✅ 答对了":"❌ 答错了，记住它"}</div>
    <div class="cn">${esc(t[1])}</div>
    ${ex?`<div class="ex">${ex}</div><div class="src">— ${src}</div>`:`<div class="src">该词组暂未在 2010–2026 真题阅读中出现</div>`}
  `;
  f.classList.add("show");
  const foot = document.getElementById("foot");
  const stage = cardOf(i).s;
  foot.innerHTML = `<button class="btn" id="next">${cur+1>=Q.length?"看结算":"下一题"} </button>`;
  document.getElementById("next").onclick = ()=>{ cur++; renderStudy(); window.scrollTo(0,0); };
  speak(t[0]);
}

function renderSummary(){
  const secs = Math.max(1, Math.round((Date.now()-roundStart)/1000));
  const acc = roundTotal? Math.round(roundRight/roundTotal*100):0;
  TOP.innerHTML = `<h1>本轮结算</h1>`;
  V.innerHTML = `
    <div class="card sum">
      <div class="big">${acc}<span style="font-size:20px">%</span></div>
      <div class="cap">正确率</div>
      <div class="grid">
        <div><div class="n">${roundTotal}</div><div class="l">答题</div></div>
        <div><div class="n">${Math.floor(secs/60)}′${secs%60}″</div><div class="l">用时</div></div>
        <div><div class="n">${wrongList.length}</div><div class="l">错题</div></div>
        <div><div class="n">${roundKilled}</div><div class="l">斩</div></div>
      </div>
    </div>
    ${killList.length?`<div class="card wlist"><h3>这轮斩掉的</h3>
      ${killList.map(i=>`<div class="wrow"><span class="p">${esc(W[i][0])}</span><span class="c">${esc(W[i][1])}</span></div>`).join("")}
    </div>`:""}
    ${wrongList.length?`<div class="card wlist"><h3>这轮错的</h3>
      ${[...new Set(wrongList)].map(i=>`<div class="wrow"><span class="p">${esc(W[i][0])}</span><span class="c">${esc(W[i][1])}</span></div>`).join("")}
    </div>`:""}
    <div class="acts">
      <button class="btn" id="again">再来一轮</button>
      ${wrongList.length?`<button class="btn soft" id="redoWrong">只练这轮的错题</button>`:""}
      <button class="btn ghost" id="home">回到首页</button>
    </div>
    <div style="height:22px"></div>`;
  document.getElementById("again").onclick = ()=>startStudy();
  document.getElementById("home").onclick = ()=>{ TAB="home"; route(); };
  const rw = document.getElementById("redoWrong");
  if(rw) rw.onclick = ()=>{ const set=[...new Set(wrongList)]; Q=set.map(i=>({i,kind:"rev"})); cur=0; roundStart=Date.now(); roundRight=0; roundTotal=0; wrongList=[]; REQ=new Set(); roundKilled=0; killList=[]; renderStudy(); };
}

/* ---------- 词书 ---------- */
let filter = "all", kw = "";
function viewBrowse(){
  TOP.innerHTML = `<h1>词书</h1><div class="sp"></div><span class="chip" id="cnt"><b>${W.length}</b> 条</span>`;
  V.innerHTML = `
    <div class="search"><input id="kw" placeholder="搜英文或中文…" value="${esc(kw)}"></div>
    <div class="filters">
      ${[["all","全部"],["new","未学"],["learning","在学"],["done","已斩"],["wrong","曾错"]]
        .map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}
    </div>
    <div class="card list" id="list"></div>
    <div style="height:18px"></div>`;
  const inp = document.getElementById("kw");
  inp.oninput = ()=>{ kw = inp.value.trim().toLowerCase(); renderList(); };
  V.querySelector(".filters").onclick = e=>{ const b=e.target.closest("[data-f]"); if(b){ filter=b.dataset.f; viewBrowse(); } };
  renderList();
}
function renderList(){
  const box = document.getElementById("list");
  if(!box) return;
  const c = S.cards;
  let rows = [];
  const all = [];
  for(let i=0;i<W.length;i++) all.push(i);
  all.sort((a,b)=>{
    const oa = ORDER.has(a)?ORDER.get(a):1e6+a, ob = ORDER.has(b)?ORDER.get(b):1e6+b;
    return oa-ob;
  });
  for(const i of all){
    const w = W[i], re = c[w[0]];
    const s = re? re.s : 0;
    if(filter==="new" && re) continue;
    if(filter==="learning" && !(re && s>0 && s<4)) continue;
    if(filter==="done" && !(re && s>=4)) continue;
    if(filter==="wrong" && !(re && re.bad>0)) continue;
    if(kw && !(w[0].toLowerCase().includes(kw) || w[1].toLowerCase().includes(kw))) continue;
    rows.push([i,s,re]);
  }
  const total = rows.length;
  const cnt = document.getElementById("cnt");
  if(cnt) cnt.innerHTML = `<b>${total}</b> 条`;
  if(!total){ box.innerHTML = `<div class="empty">没有符合条件的词</div>`; return; }
  const shown = rows.slice(0, 200);
  const foot = total > 200 ? `<div class="empty">还有 ${total-200} 条，用上方搜索缩小范围</div>` : "";
  box.innerHTML = shown.map(([i,s,re])=>`
    <div class="li">
      <span class="dot ${re&&re.bad>0?"bad":"s"+s}"></span>
      <div style="flex:1;min-width:0">
        <div class="p">${esc(W[i][0])}</div>
        <div class="c">${esc(W[i][1])}</div>
      </div>
      ${s>=4?`<button class="chip" data-revive="${i}" title="放回复习队列">复活</button>`:""}
      <button class="chip" data-speak="${i}">🔊</button>
    </div>`).join("") + foot;
  box.onclick = e=>{
    const b = e.target.closest("[data-speak]");
    if(b){ speak(W[+b.dataset.speak][0]); return; }
    const r = e.target.closest("[data-revive]");
    if(r) revive(+r.dataset.revive);
  };
}

/* ---------- 进度 ---------- */
function viewProgress(){
  const total = W.length;
  const graduated = Object.values(S.cards).filter(c=>c.s>=4).length;
  const learning = Object.values(S.cards).filter(c=>c.s>0&&c.s<4).length;
  const seen = Object.keys(S.cards).length;
  const days = Object.keys(S.days).length;
  const okAll = Object.values(S.cards).reduce((a,c)=>a+c.ok,0);
  const badAll = Object.values(S.cards).reduce((a,c)=>a+c.bad,0);
  const acc = okAll+badAll? Math.round(okAll/(okAll+badAll)*100):0;

  // 热力图：最近 30 天
  const cells = [];
  for(let k=29;k>=0;k--){
    const d = new Date(); d.setDate(d.getDate()-k);
    const s = S.days[d.toISOString().slice(0,10)];
    const n = s? s.n+s.r : 0;
    const l = n===0?0: n<10?1: n<25?2: n<50?3:4;
    cells.push(`<i data-l="${l}" title="${d.toISOString().slice(5,10)} ${n} 条"></i>`);
  }
  // 分类进度
  const byCat = [0,1,2].map(k=>{
    const idx=[]; for(let i=0;i<W.length;i++) if(W[i][2]===k) idx.push(i);
    const done = idx.filter(i=>{const c=S.cards[W[i][0]]; return c&&c.s>=4;}).length;
    return [CATS[k], idx.length, done];
  });

  TOP.innerHTML = `<h1>进度</h1>`;
  V.innerHTML = `
    <div class="card hero">
      <div class="row">
        <div class="ring">${ring(graduated/total)}<div class="num">${Math.round(graduated/total*100)}%</div></div>
        <div class="txt">
          <div class="big">已斩 ${graduated} / ${total}</div>
          <div class="sm">在学 ${learning} · 未学 ${total-seen} · 累计正确率 ${acc}%</div>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="card stat"><div class="n">${days}</div><div class="l">学习天数</div></div>
      <div class="card stat"><div class="n">${streak()}</div><div class="l">连续打卡</div></div>
      <div class="card stat"><div class="n">${okAll}</div><div class="l">累计答对</div></div>
    </div>
    <div class="top"><h1 style="font-size:15px;color:#6b7280">最近 30 天</h1></div>
    <div class="heat">${cells.join("")}</div>
    <div class="top"><h1 style="font-size:15px;color:#6b7280">分类进度</h1></div>
    <div class="bars">
      ${byCat.map(([n,tot,done])=>`<div class="bar"><span class="n">${n}</span>
        <span class="t"><i style="width:${(done/tot*100).toFixed(1)}%"></i></span>
        <span class="v">${done}/${tot}</span></div>`).join("")}
    </div>
    <div class="top"><h1 style="font-size:15px;color:#6b7280">设置</h1></div>
    <div class="card" style="margin:0 18px">
      <div class="row2"><span class="l">每天新词</span>
        <div class="r"><div class="seg" id="segNew">
          ${[10,20,40].map(n=>`<button data-n="${n}" class="${S.newPerDay===n?"on":""}">${n}</button>`).join("")}
        </div></div></div>
      <div class="row2"><span class="l">导出进度</span><button class="r" id="exp" style="color:#3b6ef6">下载 JSON</button></div>
      <div class="row2"><span class="l">导入进度</span><button class="r" id="imp" style="color:#3b6ef6">选择文件</button></div>
      <div class="row2"><span class="l" style="color:#ef4444">清空全部进度</span><button class="r" id="rst" style="color:#ef4444">重置</button></div>
    </div>
    <div style="height:22px"></div>
    <input type="file" id="file" accept="application/json" class="hide">`;
  document.getElementById("segNew").onclick = e=>{ const b=e.target.closest("[data-n]"); if(b){ S.newPerDay=+b.dataset.n; save(); viewProgress(); } };
  document.getElementById("exp").onclick = exportJSON;
  document.getElementById("imp").onclick = ()=>document.getElementById("file").click();
  document.getElementById("file").onchange = importJSON;
  document.getElementById("rst").onclick = ()=>{ if(confirm("确定清空所有学习进度？不可恢复")){ S = JSON.parse(JSON.stringify(DEFAULTS)); save(); route(); } };
}

/* ---------- 导入导出 ---------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `词组斩-进度-${todayStr()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function importJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!o.cards) throw 0;
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), o);
      save(); route(); toast("导入成功");
    }catch(err){ toast("文件格式不对"); }
  };
  r.readAsText(f);
}

/* ---------- 工具 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function highlight(sent, phrase){
  const e = esc(sent);
  const p = esc(phrase);
  try{
    const re = new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "ig");
    return e.replace(re, m=>`<mark>${m}</mark>`);
  }catch(err){ return e; }
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .92;
    speechSynthesis.speak(u);
  }catch(e){}
}
let toastT = null;
function toast(msg, action){
  let el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,23,32,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;max-width:80vw;text-align:center";
    document.body.appendChild(el);
  }
  el.textContent = "";
  el.appendChild(document.createTextNode(msg));
  if(action){
    const b = document.createElement("b");
    b.textContent = "  " + (action.label || "撤销");
    b.style.cssText = "text-decoration:underline;cursor:pointer;color:#9ec1ff;white-space:nowrap";
    b.onclick = ()=>{ clearTimeout(toastT); el.style.opacity = 0; if(action.fn) action.fn(); };
    el.appendChild(b);
  }
  el.style.opacity = 1;
  clearTimeout(toastT);
  toastT = setTimeout(()=>{ el.style.opacity = 0; }, action ? 4200 : 1800);
}

/* ---------- 路由 ---------- */
function route(){
  renderTabs(); setTabs(true);
  if(TAB==="home") viewHome();
  else if(TAB==="browse") viewBrowse();
  else viewProgress();
  window.scrollTo(0,0);
}
document.addEventListener("keydown", e=>{
  const tg = e.target;
  if(tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.isContentEditable)) return;
  if(!Q || cur>=Q.length) return;
  const map = {a:0,b:1,c:2,d:3,1:0,2:1,3:2,4:3};
  const k = e.key.toLowerCase();
  if(!answered && k in map){
    const b = document.querySelectorAll(".opt")[map[k]];
    if(b) b.click();
  }else if(k === "k" && !answered){
    const kb = document.getElementById("kill"); if(kb) kb.click();
  }else if(answered && (k==="enter"||k===" ")){
    const n = document.getElementById("next"); if(n){ e.preventDefault(); n.click(); }
  }
});
route();
// 深链：#study / #browse / #progress，方便收藏和自测
(function(){
  const h = (location.hash||"").replace("#","");
  if(h==="browse"){ TAB="browse"; route(); }
  else if(h==="progress"){ TAB="progress"; route(); }
  else if(h==="study"){ startStudy(); }
  else if(h==="scope"){ openScope(); }
})();
</script>
